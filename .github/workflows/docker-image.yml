name: Docker Image CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'              # any script baked into the image
      - 'envs/Dockerfile.hail'    # the env's own Dockerfile
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'scripts/**'
      - 'envs/Dockerfile.hail'
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        run: |
          REPO_NAME=${GITHUB_REPOSITORY##*/}
          ENV_NAME=$(basename envs/Dockerfile.hail)
          ENV_NAME=${ENV_NAME#Dockerfile.}
          echo "IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${REPO_NAME}-${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push docker containers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/Dockerfile.hail
          push: true
          tags: |
            ${{ steps.meta.outputs.IMAGE }}:latest
            ${{ steps.meta.outputs.IMAGE }}:${{ steps.meta.outputs.SHORT_SHA }}
