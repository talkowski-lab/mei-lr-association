name: Methylation Docker Image CI

on:
  push:
    paths:
      - 'scripts/**'                  # any script baked into the image
      - 'envs/methylation/Dockerfile' # the env's own Dockerfile
    branches:
      - main
      - develop
  pull_request:
    paths:
      - 'scripts/**'
      - 'envs/methylation/Dockerfile'
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Log in to ghcr.io with docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: alyenkin
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/alyenkin/insertion-methylation

      - name: Build and push docker containers
        uses: docker/build-push-action@v6
        with:
          context: .
          file: envs/methylation/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
